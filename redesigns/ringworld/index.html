    layout: postLayout, label: entry,
    vertex: { module: postMod, entryPoint: 'vs' },
    fragment: { module: postMod, entryPoint: entry, targets: [{ format, blend: additive ? { color: { srcFactor: 'one', dstFactor: 'one', operation: 'add' }, alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' } } : undefined }] },
    primitive: { topology: 'triangle-list' },
  })
  const prePipe = postPipe('prefilter', HDR), downPipe = postPipe('down', HDR), upPipe = postPipe('up', HDR, true), compPipe = postPipe('composite', format)

  const errs = await device.popErrorScope()
  if (errs) throw new Error('[webgpu] ' + errs.message)

  let rt = null
  function targets(sw, sh, levels) {
    if (rt && rt.w === sw && rt.h === sh && rt.levels === levels) return rt
    rt?.all.forEach((t) => t.destroy())
    const mk = (w, h) => device.createTexture({ size: [Math.max(1, w), Math.max(1, h)], format: HDR, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING })
    const hdr = mk(sw, sh)
    const mips = []
    for (let i = 0; i < levels; i++) mips.push(mk(sw >> (i + 1), sh >> (i + 1)))
    const bg = (a, b) => device.createBindGroup({ layout: postBGL, entries: [{ binding: 0, resource: a.createView() }, { binding: 1, resource: sampler }, { binding: 2, resource: { buffer: cbuf } }, { binding: 3, resource: (b || a).createView() }] })
    rt = {
      w: sw, h: sh, levels, hdr, mips, all: [hdr, ...mips],
      hdrView: hdr.createView(), mipViews: mips.map((m) => m.createView()),
      preBG: bg(hdr), downBG: mips.map((m) => bg(m)), compBG: bg(hdr, mips[0]),
    }
    return rt
  }

  const pass = (enc, view, pipe, bg, load) => {
    const p = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: load ? 'load' : 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] })
    p.setPipeline(pipe); p.setBindGroup(0, bg); p.draw(3); p.end()
  }

  return {
    info: (adapter.info && [adapter.info.vendor, adapter.info.architecture, adapter.info.description].filter(Boolean).join(' · ')) || 'WebGPU adapter',
    setParticles,
    frame(U, C, s) {
      if (lost) throw new Error('device lost')
      const t = targets(s.sw, s.sh, Render.info.tier.bloomLevels || 6)
      device.queue.writeBuffer(ubuf, 0, U)
      device.queue.writeBuffer(cbuf, 0, C)
      const enc = device.createCommandEncoder()
      const cp = enc.beginComputePass(); cp.setPipeline(computePipe); cp.setBindGroup(0, computeBG); cp.dispatchWorkgroups(Math.ceil(pcount / 64)); cp.end()
      const sp = enc.beginRenderPass({ colorAttachments: [{ view: t.hdrView, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] })
      sp.setPipeline(scenePipe); sp.setBindGroup(0, sceneBG); sp.draw(3)
      sp.setPipeline(partPipe); sp.setBindGroup(0, partBG); sp.draw(6, pcount)
      sp.end()
      pass(enc, t.mipViews[0], prePipe, t.preBG)
      for (let i = 1; i < t.levels; i++) pass(enc, t.mipViews[i], downPipe, t.downBG[i - 1])
      for (let i = t.levels - 1; i > 0; i--) pass(enc, t.mipViews[i - 1], upPipe, t.downBG[i], true)
      pass(enc, ctx.getCurrentTexture().createView(), compPipe, t.compBG)
      device.queue.submit([enc.finish()])
    },
    destroy() { try { device.destroy() } catch {} },
  }
}

// ---------------------------------------------------------------------------
// WebGL2 backend
// ---------------------------------------------------------------------------
function createWebGL2(canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' })
  if (!gl) return null
  const hdr = !!gl.getExtension('EXT_color_buffer_float')
  gl.getExtension('OES_texture_float_linear')
  const compile = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
    return s
  }
  const program = (vs, fs) => {
    const p = gl.createProgram()
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs))
    gl.linkProgram(p)
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
    return { p, U: gl.getUniformLocation(p, 'U'), C: gl.getUniformLocation(p, 'C'), src: gl.getUniformLocation(p, 'uSrc'), src2: gl.getUniformLocation(p, 'uSrc2') }
  }
  const sceneFS = hdr ? GLSL_SCENE_FS : GLSL_SCENE_FS.replace('precision highp int;', 'precision highp int;\n#define LDR 1')
  const P = {
    scene: program(GLSL_FULL_VS, sceneFS),
    part: program(GLSL_PART_VS, GLSL_PART_FS),
  }
  if (hdr) Object.assign(P, {
    pre: program(GLSL_FULL_VS, GLSL_PREFILTER), down: program(GLSL_FULL_VS, GLSL_DOWN),
    up: program(GLSL_FULL_VS, GLSL_UP), comp: program(GLSL_FULL_VS, GLSL_COMPOSITE),
  })
  const vao = gl.createVertexArray()
  let pcount = 4000
  let rt = null
  const mkTex = (w, h) => {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t)
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null)
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f)
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0)
    return { t, f, w, h }
  }
  function targets(sw, sh, levels) {
    if (rt && rt.w === sw && rt.h === sh && rt.levels === levels) return rt
    if (rt) rt.all.forEach((x) => { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f) })
    const main = mkTex(sw, sh), mips = []
    for (let i = 0; i < levels; i++) mips.push(mkTex(Math.max(1, sw >> (i + 1)), Math.max(1, sh >> (i + 1))))
    rt = { w: sw, h: sh, levels, main, mips, all: [main, ...mips] }
    return rt
  }
  const draw = (prog, target, w, h, U, C, src, src2) => {
    gl.useProgram(prog.p)
    gl.bindFramebuffer(gl.FRAMEBUFFER, target)
    gl.viewport(0, 0, w, h)
    if (prog.U && U) gl.uniform4fv(prog.U, U)
    if (prog.C && C) gl.uniform4fv(prog.C, C)
    if (src) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src); gl.uniform1i(prog.src, 0) }
    if (src2) { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src2); gl.uniform1i(prog.src2, 1) }
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }
  const dbg = gl.getExtension('WEBGL_debug_renderer_info')
  return {
    info: 'WebGL2 · ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) + (hdr ? '' : ' · LDR'),
    setParticles(n) { pcount = n },
    frame(U, C, s) {
      gl.bindVertexArray(vao)
      gl.disable(gl.BLEND)
      if (!hdr) {
        draw(P.scene, null, s.cw, s.ch, U)
        return
      }
      const t = targets(s.sw, s.sh, Render.info.tier.bloomLevels || 6)
      draw(P.scene, t.main.f, t.w, t.h, U)
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA)
      gl.useProgram(P.part.p); gl.uniform4fv(P.part.U, U)
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, pcount)
      gl.disable(gl.BLEND)
      draw(P.pre, t.mips[0].f, t.mips[0].w, t.mips[0].h, null, C, t.main.t)
      for (let i = 1; i < t.levels; i++) draw(P.down, t.mips[i].f, t.mips[i].w, t.mips[i].h, null, C, t.mips[i - 1].t)
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE)
      for (let i = t.levels - 1; i > 0; i--) draw(P.up, t.mips[i - 1].f, t.mips[i - 1].w, t.mips[i - 1].h, null, C, t.mips[i].t)
      gl.disable(gl.BLEND)
      draw(P.comp, null, s.cw, s.ch, null, C, t.main.t, t.mips[0].t)
    },
    destroy() { gl.getExtension('WEBGL_lose_context')?.loseContext() },
  }
}

// ---------------------------------------------------------------------------
// Canvas 2D fallback: a painted plate, drifted slowly. No GPU required.
// ---------------------------------------------------------------------------
function create2D(canvas) {
  const ctx = canvas.getContext('2d')
  let plate = null, pw = 0, ph = 0
  function paint(w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h
    const g = c.getContext('2d')
    const sky = g.createLinearGradient(0, 0, 0, h)
    sky.addColorStop(0, '#02040a'); sky.addColorStop(1, '#071322')
    g.fillStyle = sky; g.fillRect(0, 0, w, h)
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
    for (let i = 0; i < 26; i++) {
      const x = rnd() * w, y = rnd() * h * 0.7, r = (0.15 + rnd() * 0.35) * w
      const n = g.createRadialGradient(x, y, 0, x, y, r)
      n.addColorStop(0, rnd() > 0.5 ? 'rgba(40,90,140,0.06)' : 'rgba(120,40,100,0.05)'); n.addColorStop(1, 'rgba(0,0,0,0)')
      g.fillStyle = n; g.fillRect(0, 0, w, h)
    }
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(220,230,255,${Math.pow(rnd(), 3)})`; g.fillRect(rnd() * w, rnd() * h, 1.2, 1.2) }
    const px = w * 0.78, py = h * 1.02, pr = h * 0.62
    const lim = g.createRadialGradient(px, py, pr * 0.96, px, py, pr * 1.08)
    lim.addColorStop(0, 'rgba(140,200,255,0.5)'); lim.addColorStop(1, 'rgba(140,200,255,0)')
    g.fillStyle = lim; g.beginPath(); g.arc(px, py, pr * 1.1, 0, 7); g.fill()
    g.save(); g.beginPath(); g.arc(px, py, pr, 0, 7); g.clip()
    for (let i = 0; i < 40; i++) {
      const y = py - pr + (i / 40) * pr * 2
      g.fillStyle = ['#6b4a30', '#c08a55', '#e6d2a8', '#9a6a44', '#d9c6a0'][i % 5]
      g.globalAlpha = 0.9; g.fillRect(px - pr, y, pr * 2, (pr * 2) / 40 + 1)
    }
    g.globalAlpha = 1
    const term = g.createLinearGradient(px - pr, py - pr, px + pr * 0.6, py + pr * 0.2)
    term.addColorStop(0, 'rgba(0,0,0,0.97)'); term.addColorStop(0.55, 'rgba(0,0,0,0.9)'); term.addColorStop(0.85, 'rgba(0,0,0,0.25)'); term.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = term; g.fillRect(px - pr, py - pr, pr * 2, pr * 2)
    g.restore()
    g.save(); g.translate(w * 0.58, h * 0.6); g.rotate(-0.08)
    g.strokeStyle = 'rgba(110,150,170,0.9)'; g.lineWidth = h * 0.012
    g.beginPath(); g.ellipse(0, 0, w * 0.62, h * 0.2, 0, Math.PI * 1.02, Math.PI * 1.98); g.stroke()
    g.strokeStyle = 'rgba(20,24,30,1)'; g.lineWidth = h * 0.05
    g.beginPath(); g.ellipse(0, 0, w * 0.62, h * 0.2, 0, Math.PI * 0.05, Math.PI * 0.95); g.stroke()
    g.restore()
    const sx = w * 0.86, sy = h * 0.16
    const sun = g.createRadialGradient(sx, sy, 0, sx, sy, h * 0.5)
    sun.addColorStop(0, 'rgba(255,250,235,1)'); sun.addColorStop(0.03, 'rgba(255,240,210,0.8)'); sun.addColorStop(0.2, 'rgba(160,200,255,0.12)'); sun.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = sun; g.fillRect(0, 0, w, h)
    g.fillStyle = 'rgba(140,190,255,0.25)'; g.fillRect(0, sy - 1, w, 2)
    return c
  }
  return {
    info: 'Canvas 2D fallback',
    frame(U, C, s) {
      const w = s.cw, h = s.ch
      if (!plate || pw !== w || ph !== h) { plate = paint(Math.round(w * 1.06), Math.round(h * 1.06)); pw = w; ph = h }
      const t = U[3] ? U[0 * 4 + 3] : 0
      ctx.drawImage(plate, -w * 0.03 + Math.sin(t * 0.05) * w * 0.02, -h * 0.03 + Math.cos(t * 0.04) * h * 0.01)
    },
  }
}

// ---------------------------------------------------------------------------
// Sound: everything synthesized. Choir pad = detuned saws through a formant
// filter bank into a generated convolution reverb. Nothing plays until the
// visitor turns sound on, and the AudioContext is created inside that gesture.
// ---------------------------------------------------------------------------
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, verb, padTimer = null
  let enabled = false, musicVol = 0.7, sfxVol = 0.8, nextChord = 0, chordIx = 0, cycle = 0
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12)

  // Formants (Hz, relative gain) for sung vowels.
  const VOWELS = {
    a: [[780, 1], [1150, 0.5], [2800, 0.16]],
    o: [[480, 1], [820, 0.45], [2750, 0.1]],
    u: [[330, 1], [720, 0.28], [2500, 0.06]],
    e: [[420, 1], [1750, 0.32], [2600, 0.14]],
  }
  // Original progression in D minor (i - VI - iv - V - III - VII - VI - v), voiced wide.
  const CHORDS = [
    { bass: 38, notes: [50, 57, 62, 65, 69], v: 'a', mel: [[74, 0, 4], [76, 4.2, 4]] },
    { bass: 34, notes: [53, 58, 62, 65, 69], v: 'o', mel: [[77, 0, 5], [74, 5.2, 3.5]] },
    { bass: 31, notes: [50, 55, 58, 62, 67], v: 'a', mel: [[74, 0, 3.5], [70, 3.8, 4.5]] },
    { bass: 33, notes: [52, 57, 61, 64, 69], v: 'e', mel: [[73, 0, 6], [76, 6.2, 2.4]] },
    { bass: 29, notes: [48, 53, 57, 60, 65], v: 'o', mel: [[72, 0, 4], [69, 4.2, 4]] },
    { bass: 36, notes: [48, 55, 60, 64, 67], v: 'a', mel: [[67, 0, 3], [72, 3.2, 5]] },
    { bass: 34, notes: [50, 53, 58, 62, 69], v: 'u', mel: [[74, 0, 4], [77, 4.2, 4]] },
    { bass: 33, notes: [52, 57, 60, 64, 69], v: 'e', mel: [[76, 0, 5], [72, 5.2, 3]] },
  ]
  const CH_DUR = 8.5

  function impulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate)
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0
      for (let i = 0; i < len; i++) {
        const t = i / len
        const k = 0.15 + 0.8 * t // darker as it decays
        lp += ((Math.random() * 2 - 1) - lp) * (1 - k)
        d[i] = lp * Math.pow(1 - t, decay) * (i < 400 ? i / 400 : 1)
      }
      // a few early reflections
      for (let r = 0; r < 6; r++) { const at = Math.floor(ctx.sampleRate * (0.012 + r * 0.017 + ch * 0.005)); if (at < len) d[at] += (0.5 - r * 0.07) * (Math.random() > 0.5 ? 1 : -1) }
    }
    return buf
  }

  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)()
    master = ctx.createGain(); master.gain.value = 0
    const comp = ctx.createDynamicsCompressor()
    comp.threshold.value = -16; comp.ratio.value = 3.5; comp.attack.value = 0.01; comp.release.value = 0.4
    master.connect(comp).connect(ctx.destination)
    verb = ctx.createConvolver(); verb.buffer = impulse(6, 2.4)
    const wet = ctx.createGain(); wet.gain.value = 0.85
    verb.connect(wet).connect(master)
    musicBus = ctx.createGain(); musicBus.gain.value = musicVol * 0.55
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200; lp.Q.value = 0.4
    const dry = ctx.createGain(); dry.gain.value = 0.3
    musicBus.connect(lp); lp.connect(dry).connect(master); lp.connect(verb)
    sfxBus = ctx.createGain(); sfxBus.gain.value = sfxVol * 0.5
    sfxBus.connect(master)
    const send = ctx.createGain(); send.gain.value = 0.18; sfxBus.connect(send).connect(verb)
  }

  // One sung note: 3 detuned saws with vibrato, through a vowel formant bank.
  function voice(midi, t0, dur, gain, vowel, toVowel, att = 3.2, rel = 3.8) {
    const out = ctx.createGain(); out.gain.value = 0
    out.gain.setValueAtTime(0, t0)
    out.gain.linearRampToValueAtTime(gain, t0 + att)
    out.gain.setValueAtTime(gain, t0 + Math.max(att, dur - rel))
    out.gain.linearRampToValueAtTime(0, t0 + dur)
    out.connect(musicBus)
    const V = VOWELS[vowel], V2 = VOWELS[toVowel || vowel]
    const bank = V.map(([f, g], i) => {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 7 + i * 2
      bp.frequency.setValueAtTime(f, t0); bp.frequency.linearRampToValueAtTime(V2[i][0], t0 + dur * 0.8)
      const gg = ctx.createGain(); gg.gain.value = g * 2.6
      bp.connect(gg).connect(out); return bp
    })
    const f = mtof(midi)
    for (const cents of [-11, 0, 9]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f
      o.detune.value = cents + (Math.random() - 0.5) * 5
      const lfo = ctx.createOscillator(); lfo.frequency.value = 4.6 + Math.random() * 0.9
      const lg = ctx.createGain(); lg.gain.value = 0
      lg.gain.setValueAtTime(0, t0); lg.gain.linearRampToValueAtTime(7, t0 + att * 1.2)
      lfo.connect(lg).connect(o.detune)
      bank.forEach((b) => o.connect(b))
      o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05)
    }
  }

  function sub(midi, t0, dur, gain) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(midi)
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 3); g.gain.setValueAtTime(gain, t0 + dur - 3.5); g.gain.linearRampToValueAtTime(0, t0 + dur)
    o.connect(g).connect(musicBus); o.start(t0); o.stop(t0 + dur + 0.05)
  }

  function shimmer(t0) {
    const pent = [81, 84, 86, 88, 91, 93]
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(pent[Math.floor(Math.random() * pent.length)])
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.03, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.5)

  function schedule() {
    if (!ctx || !enabled) return

      const C = CHORDS[chordIx]

      sub(C.bass, t0, dur, 0.09)

      for (let k = 0; k < 2; k++) if (Math.random() > 0.35) shimmer(t0 + 1 + Math.random() * CH_DUR)
      nextChord = t0 + CH_DUR

      if (chordIx === 0) cycle++

  }

  function blip(kind) {
    if (!ctx || !enabled) return

      o.connect(g).connect(sfxBus); o.start(t + at); o.stop(t + at + dur + 0.02)

    const noise = (dur, f0, f1, peak, at = 0) => {
      const len = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0)
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1

      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(peak, t + at + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur)

      case 'move': tone('sine', 1560, 2100, 0.07, 0.16); tone('triangle', 3120, 3300, 0.03, 0.03); break
      case 'select': tone('sine', 880, 1320, 0.12, 0.2); tone('sine', 1320, 1980, 0.16, 0.16, 0.05); noise(0.32, 600, 4200, 0.05, 0.02); break
      case 'back': tone('sine', 1400, 700, 0.14, 0.17); noise(0.22, 3000, 500, 0.03); break
      case 'tick': tone('square', 2600, 2600, 0.018, 0.02); break
      case 'found': [0, 0.09, 0.18].forEach((at, i) => tone('sine', [988, 1319, 1976][i], [988, 1319, 1976][i] * 1.002, 0.6, 0.12, at)); break
      case 'start': tone('sine', 220, 880, 1.6, 0.18); noise(1.8, 200, 6000, 0.08); tone('sine', 1760, 1760, 1.2, 0.05, 0.4); break
      case 'error': tone('square', 220, 180, 0.18, 0.05); break
    }
  }

  return {
    get enabled() { return enabled },
    get ready() { return !!ctx },
    setEnabled(on) {
      if (on && !ctx) init()
      enabled = !!on
      if (!ctx) return
      if (ctx.state === 'suspended') ctx.resume()

    setSfx(v) { sfxVol = v; if (sfxBus) sfxBus.gain.setTargetAtTime(v * 0.5, ctx.currentTime, 0.05) },
    get musicVol() { return musicVol },
    get sfxVol() { return sfxVol },

})()

// ---------------------------------------------------------------------------
// Procedural art: every image on the page is painted here from a seed.
// ---------------------------------------------------------------------------
const Art = (() => {
  const hashStr = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return h >>> 0 }
  const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
  const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t))
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`

  const PALETTES = [
    { name: 'dawn', sky: ['#0b1630', '#3d4a78', '#e7a06c'], sun: '#ffe6bc', fog: '#e9ad83', land: ['#7c6476', '#4a3a52', '#1d1624'], acc: '#ffd39a' },
    { name: 'day', sky: ['#15406a', '#3f86b8', '#bfe2ee'], sun: '#ffffff', fog: '#c6e6ef', land: ['#6f909a', '#3c5e68', '#142730'], acc: '#e9f8ff' },
    { name: 'dusk', sky: ['#120a24', '#4d2653', '#d0718a'], sun: '#ffd0c0', fog: '#cf8399', land: ['#5d3d62', '#30213e', '#120c19'], acc: '#ffb3c2' },
    { name: 'storm', sky: ['#11181f', '#34434e', '#7d929c'], sun: '#dfeaf0', fog: '#92a6b0', land: ['#4f5d64', '#2b3439', '#101416'], acc: '#c9e3f0' },
    { name: 'night', sky: ['#01040b', '#06142a', '#123045'], sun: '#bfe8ff', fog: '#1f4258', land: ['#13212b', '#0a141b', '#030609'], acc: '#7dffcf' },
    { name: 'desert', sky: ['#2d5579', '#6f9fc4', '#efd5a2'], sun: '#fff6e0', fog: '#f0d9aa', land: ['#b38c5c', '#7b5a39', '#33261a'], acc: '#fff0c8' },
  ]

  function ridge(r, w, n, rough) {
    const pts = new Float32Array(n + 1)
    pts[0] = r(); pts[n] = r()
    let step = n
    let amp = 1
    while (step > 1) {
      const half = step >> 1
      for (let i = half; i < n; i += step) pts[i] = (pts[i - half] + pts[i + half]) / 2 + (r() - 0.5) * amp
      amp *= rough; step = half
    }
    return pts
  }

  const cache = new Map()
  function missionPlate(key, w = 480, h = 270, kind = 'land') {
    const id = key + kind + w
    if (cache.has(id)) return cache.get(id)
    const c = document.createElement('canvas'); c.width = w; c.height = h
    const g = c.getContext('2d')
    const r = rng(hashStr(key))
    if (kind === 'film') paintInterior(g, w, h, r)
    else paintLandscape(g, w, h, r)
    // grade, vignette, grain
    const vg = g.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, w * 0.7)
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)')
    g.fillStyle = vg; g.fillRect(0, 0, w, h)
    const img = g.getImageData(0, 0, w, h), d = img.data
    for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n }
    g.putImageData(img, 0, 0)
    cache.set(id, c)
    return c
  }

  function paintLandscape(g, w, h, r) {
    const P = PALETTES[Math.floor(r() * PALETTES.length)]
    const hz = h * (0.52 + r() * 0.14)
    const sky = g.createLinearGradient(0, 0, 0, hz)
    sky.addColorStop(0, P.sky[0]); sky.addColorStop(0.55, P.sky[1]); sky.addColorStop(1, P.sky[2])
    g.fillStyle = sky; g.fillRect(0, 0, w, h)
    if (P.name === 'night' || P.name === 'dusk') {
      for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(230,240,255,${Math.pow(r(), 3) * 0.9})`; g.fillRect(r() * w, r() * hz * 0.9, 1, 1) }
    }
    if (P.name === 'night') {
      for (let k = 0; k < 3; k++) {
        g.save(); g.globalCompositeOperation = 'lighter'
        const ay = hz * (0.25 + k * 0.12)
        const ag = g.createLinearGradient(0, ay - 40, 0, ay + 30)
        ag.addColorStop(0, 'rgba(60,255,180,0)'); ag.addColorStop(0.6, `rgba(60,255,180,${0.12 - k * 0.03})`); ag.addColorStop(1, 'rgba(60,255,180,0)')
        g.fillStyle = ag; g.beginPath(); g.moveTo(0, ay)
        for (let x = 0; x <= w; x += 16) g.lineTo(x, ay + Math.sin(x * 0.012 + k * 2 + r()) * 18)
        g.lineTo(w, ay + 60); g.lineTo(0, ay + 60); g.fill(); g.restore()
      }
    }
    // the ring rising out of the horizon
    const cx = w * (0.2 + r() * 0.6), rx = w * (0.9 + r() * 0.8), ry = hz * (0.75 + r() * 0.5), tilt = (r() - 0.5) * 0.35
    g.save(); g.translate(cx, hz + ry * 0.12); g.rotate(tilt)
    const bandW = Math.max(3, h * 0.022)
    g.lineCap = 'butt'
    g.strokeStyle = rgb(mix(hex(P.sky[2]), hex(P.sun), 0.5), 0.7); g.lineWidth = bandW
    g.beginPath(); g.ellipse(0, 0, rx, ry, 0, Math.PI * 1.04, Math.PI * 1.96); g.stroke()
    g.strokeStyle = rgb(hex(P.land[2]), 0.5); g.lineWidth = bandW * 0.35
    g.beginPath(); g.ellipse(0, 0, rx + bandW * 0.5, ry + bandW * 0.5, 0, Math.PI * 1.04, Math.PI * 1.96); g.stroke()
    g.restore()
    // fade ring into sky near horizon
    const hzf = g.createLinearGradient(0, hz - h * 0.25, 0, hz)
    hzf.addColorStop(0, rgb(hex(P.sky[2]), 0)); hzf.addColorStop(1, rgb(hex(P.sky[2]), 0.85))
    g.fillStyle = hzf; g.fillRect(0, hz - h * 0.25, w, h * 0.25)
    // sun
    const sx = w * (0.15 + r() * 0.7), sy = hz * (0.35 + r() * 0.5)
    const sg = g.createRadialGradient(sx, sy, 0, sx, sy, h * 0.6)
    sg.addColorStop(0, rgb(hex(P.sun), 1)); sg.addColorStop(0.025, rgb(hex(P.sun), 0.9)); sg.addColorStop(0.12, rgb(hex(P.sun), 0.25)); sg.addColorStop(1, rgb(hex(P.sun), 0))
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = sg; g.fillRect(0, 0, w, h); g.restore()
    // mountain layers
    const layers = 4
    for (let L = 0; L < layers; L++) {
      const t = L / (layers - 1)
      const col = mix(mix(hex(P.fog), hex(P.land[0]), 0.35), hex(P.land[2]), t)
      const base = hz + (h - hz) * (t * 0.85) - h * 0.02
      const amp = h * (0.22 - t * 0.1) * (0.6 + r() * 0.6)
      const pts = ridge(r, w, 64, 0.55)
      g.fillStyle = rgb(col)
      g.beginPath(); g.moveTo(0, h)
      for (let i = 0; i <= 64; i++) g.lineTo((i / 64) * w, base - pts[i] * amp)
      g.lineTo(w, h); g.closePath(); g.fill()
      // rim light along the ridge, side facing the sun
      g.strokeStyle = rgb(hex(P.acc), 0.12 * (1 - t)); g.lineWidth = 1
      g.beginPath(); for (let i = 0; i <= 64; i++) g.lineTo((i / 64) * w, base - pts[i] * amp); g.stroke()
      // structures on the second layer
      if (L === 1 && r() > 0.25) {
        const n = 1 + Math.floor(r() * 3), sx0 = r() * w
        for (let k = 0; k < n; k++) {
          const px = (sx0 + k * w * 0.07) % w, ph = h * (0.16 + r() * 0.22), pw = Math.max(4, w * 0.012)
          const yb = base - pts[Math.round((px / w) * 64)] * amp + 4
          g.fillStyle = rgb(mix(col, [0, 0, 0], 0.25))
          g.beginPath(); g.moveTo(px - pw, yb); g.lineTo(px - pw * 0.35, yb - ph); g.lineTo(px + pw * 0.35, yb - ph); g.lineTo(px + pw, yb); g.fill()
          g.save(); g.globalCompositeOperation = 'lighter'
          g.fillStyle = rgb(hex(P.acc), 0.5); g.fillRect(px - 0.6, yb - ph * 0.95, 1.2, ph * 0.8)
          const bg = g.createRadialGradient(px, yb - ph, 0, px, yb - ph, 18); bg.addColorStop(0, rgb(hex(P.acc), 0.5)); bg.addColorStop(1, rgb(hex(P.acc), 0))
          g.fillStyle = bg; g.fillRect(px - 20, yb - ph - 20, 40, 40); g.restore()
        }
      }
      // fog between layers
      const fg = g.createLinearGradient(0, base - amp, 0, base + h * 0.1)
      fg.addColorStop(0, rgb(hex(P.fog), 0)); fg.addColorStop(1, rgb(hex(P.fog), 0.22 * (1 - t)))
      g.fillStyle = fg; g.fillRect(0, base - amp, w, h)
    }
    // god rays
    g.save(); g.globalCompositeOperation = 'lighter'
    for (let i = 0; i < 6; i++) {
      const a = r() * Math.PI * 2, len = h * 1.4
      g.fillStyle = rgb(hex(P.sun), 0.025)
      g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len); g.lineTo(sx + Math.cos(a + 0.08) * len, sy + Math.sin(a + 0.08) * len); g.fill()
    }
    g.restore()
  }

  function paintInterior(g, w, h, r) {
    const tint = r() > 0.5 ? [90, 200, 255] : [255, 170, 80]
    const tint2 = r() > 0.5 ? [255, 120, 90] : [120, 255, 200]
    g.fillStyle = '#030609'; g.fillRect(0, 0, w, h)
    const vx = w * (0.38 + r() * 0.24), vy = h * (0.42 + r() * 0.16)
    // corridor walls as nested frames receding to the vanishing point
    const depth = 14
    for (let i = depth; i >= 0; i--) {
      const t = i / depth, s = Math.pow(1 - t, 1.6) * 1.15 + 0.05
      const x0 = vx - vx * s * 1.2, x1 = vx + (w - vx) * s * 1.2, y0 = vy - vy * s * 1.1, y1 = vy + (h - vy) * s * 1.1
      const lum = 0.06 + (1 - t) * 0.05
      g.strokeStyle = rgb(mix([20, 30, 40], tint, lum), 0.9); g.lineWidth = 1 + (1 - t) * 3
      g.strokeRect(x0, y0, x1 - x0, y1 - y0)

        g.save(); g.globalCompositeOperation = 'lighter'
        g.shadowColor = rgb(tint, 0.9); g.shadowBlur = 12
        g.fillStyle = rgb(tint, 0.25 + 0.4 * (1 - t))
        g.fillRect(x0 + (x1 - x0) * 0.3, y0 + 1, (x1 - x0) * 0.4, Math.max(1, 3 * (1 - t)))
        g.restore()
      }
    }
    // far doorway glow
    const dg = g.createRadialGradient(vx, vy, 0, vx, vy, h * 0.4)
    dg.addColorStop(0, rgb(mix(tint, [255, 255, 255], 0.6), 0.9)); dg.addColorStop(0.1, rgb(tint, 0.35)); dg.addColorStop(1, rgb(tint, 0))
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = dg; g.fillRect(0, 0, w, h)
    // floor reflection streak
    const fl = g.createLinearGradient(0, vy, 0, h)
    fl.addColorStop(0, rgb(tint, 0.2)); fl.addColorStop(1, rgb(tint, 0))
    g.fillStyle = fl; g.beginPath(); g.moveTo(vx - 6, vy); g.lineTo(vx + 6, vy); g.lineTo(vx + w * 0.16, h); g.lineTo(vx - w * 0.16, h); g.fill()
    // accent panel lights
    for (let i = 0; i < 6; i++) {
      const side = r() > 0.5 ? 1 : -1, t = r()
      const x = vx + side * (w * 0.08 + t * w * 0.45), y = vy + (r() - 0.5) * h * 0.5 * (0.3 + t)
      g.shadowColor = rgb(tint2, 1); g.shadowBlur = 10

    }
    g.restore()

      g.fillStyle = '#020305'
      g.beginPath(); g.ellipse(fx, fy - fh * 0.88, fh * 0.07, fh * 0.09, 0, 0, 7); g.fill()
      g.beginPath(); g.moveTo(fx - fh * 0.14, fy - fh * 0.75); g.lineTo(fx + fh * 0.14, fy - fh * 0.75); g.lineTo(fx + fh * 0.1, fy - fh * 0.3); g.lineTo(fx + fh * 0.08, fy); g.lineTo(fx - fh * 0.08, fy); g.lineTo(fx - fh * 0.1, fy - fh * 0.3); g.fill()
    }
  }

  function drawPlate(canvas, key, kind) {
    const p = missionPlate(key, 480, 270, kind)
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    const cw = Math.max(1, Math.round(canvas.clientWidth * dpr)), ch = Math.max(1, Math.round(canvas.clientHeight * dpr))

    const g = canvas.getContext('2d')

    g.drawImage(p, (cw - p.width * s) / 2, (ch - p.height * s) / 2, p.width * s, p.height * s)

  const MEDAL_ICONS = {
    dawn: '<circle cx="24" cy="27" r="7"/><path d="M10 34h28M13 22l-4-3M35 22l4-3M24 14v-5"/>',
    star: '<path d="M24 9l4 10 11 1-8 7 3 11-10-6-10 6 3-11-8-7 11-1z"/>',
    twin: '<circle cx="18" cy="24" r="6"/><circle cx="30" cy="24" r="6"/>',

    film: '<rect x="11" y="14" width="26" height="20"/><path d="M11 19h26M11 29h26M17 14v5M24 14v5M31 14v5"/>',
    cube: '<path d="M24 10l12 7v14l-12 7-12-7V17z"/><path d="M12 17l12 7 12-7M24 24v14"/>',

      Art.drawPlate($('#film-detail canvas'), n.slug, 'film')
    },
    hints: () => [['↑↓', 'Browse'], ['↵', 'Play film'], ['Esc', 'Back']],
  }

  // ---- FILM PLAYER ----
  const film = { n: null, t: 0, playing: false, speed: 1, last: 0, raf: 0 }
  S.film = {
    pose: 'theater', parent: 'theater',
    crumb: (a) => `Theater › <b>${esc((notes.find((n) => n.slug === a) || notes[0]).title)}</b>`,
    html: (slug) => {
      const n = notes.find((x) => x.slug === slug) || notes[0]
      film.n = n; film.t = 0; film.playing = prefs.motion !== 'reduced'; film.speed = 1
      const paras = n.text.split(/\n\n+/); let acc = 0
      const ticks = paras.slice(0, -1).map((p) => { acc += p.length + 2; return acc / n.text.length })
      return `
      <div class="scr-head holo"><h1 class="scr-title">Theater</h1><p class="scr-sub">Now playing · ${esc(n.date)}</p></div>
      <div class="film panel holo">
        <div class="film-view">
          <div class="film-frame"><canvas id="film-cv" aria-hidden="true"></canvas><div class="film-hud"><span class="rec"><i></i>Playback</span><span class="tc" id="film-tc">00:00</span><span class="cam">Camera: free · ${esc(n.title)}</span></div></div>
          <div class="transcript" id="film-tx" aria-live="off"></div>
        </div>
        <div class="timeline">
          <button class="tbtn" data-nav data-act="play" aria-label="Play or pause"><svg viewBox="0 0 14 14" id="play-ico"></svg></button>
          <button class="tbtn" data-nav data-act="restart" aria-label="Restart"><svg viewBox="0 0 14 14"><path d="M2 2h2v10H2zM13 2v10L5 7z"/></svg></button>
          <div class="track" data-nav data-act="track" role="slider" aria-label="Timeline" aria-valuemin="0" aria-valuemax="100" tabindex="0"><div class="rail"></div>${ticks.map((t) => `<div class="tick" style="left:${(t * 100).toFixed(2)}%"></div>`).join('')}<div class="fill" id="film-fill"></div><div class="head" id="film-head"></div></div>
          <div style="display:flex;gap:14px;align-items:center"><span class="tread" id="film-read"></span><button class="speed" data-nav data-act="speed" id="film-speed" aria-label="Playback speed">1×</button><a class="cta ghost" data-nav href="${esc(fullUrl(n.href))}" target="_blank" rel="noopener" style="height:34px">Open ›</a></div>
        </div>
      </div>`
    },
    after() { filmRender(true); cancelAnimationFrame(film.raf); film.last = performance.now(); film.raf = requestAnimationFrame(filmTick); bindTrack() },
    leave() { cancelAnimationFrame(film.raf); film.playing = false },
    horizontal(dir) { film.t = Math.max(0, Math.min(1, film.t + dir * 0.05)); filmRender(); Sound.blip('tick'); return true },
    activate(el) {
      const a = el.dataset.act
      if (a === 'play') { if (film.t >= 1) film.t = 0; film.playing = !film.playing; filmRender(); return true }
      if (a === 'restart') { film.t = 0; film.playing = true; filmRender(); return true }
      if (a === 'speed') { film.speed = film.speed >= 4 ? 1 : film.speed * 2; filmRender(); return true }
      if (a === 'track') { film.playing = !film.playing; filmRender(); return true }
    },
    hints: () => [['Space', 'Play / pause'], ['←→', 'Scrub'], ['Esc', 'Back']],
  }
  function filmTick(now) {
    const dt = Math.min(0.1, (now - film.last) / 1000); film.last = now
    if (film.playing && film.n) { film.t = Math.min(1, film.t + (dt * film.speed) / film.n.secs); if (film.t >= 1) film.playing = false; filmRender() }
    film.raf = requestAnimationFrame(filmTick)
  }
  let lastFrameDraw = 0
  function filmRender(force) {
    const n = film.n; if (!n) return
    const tx = $('#film-tx'); if (!tx) return
    const k = Math.floor(film.t * n.text.length)
    tx.innerHTML = `<span style="white-space:pre-wrap">${esc(n.text.slice(0, k))}</span><span class="caret"></span><span class="ghost" style="white-space:pre-wrap">${esc(n.text.slice(k))}</span>`
    const pct = (film.t * 100).toFixed(2) + '%'
    $('#film-fill').style.width = pct; $('#film-head').style.left = pct
    $('.track')?.setAttribute('aria-valuenow', Math.round(film.t * 100))
    $('#film-tc').textContent = fmtTime(film.t * n.secs) + ' / ' + fmtTime(n.secs)
    $('#film-read').textContent = fmtTime(film.t * n.secs)
    $('#film-speed').textContent = film.speed + '×'
    $('#play-ico').innerHTML = film.playing ? '<path d="M3 2h3v10H3zM8 2h3v10H8z"/>' : '<path d="M3 1.5v11L12 7z"/>'
    const now = performance.now()
    if (force || now - lastFrameDraw > 60) { lastFrameDraw = now; Art.filmFrame($('#film-cv'), n.slug, film.t) }
  }
  function bindTrack() {
    const tr = $('.screen.active .track'); if (!tr) return
    const set = (e) => { const r = tr.getBoundingClientRect(); film.t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); filmRender() }
    tr.addEventListener('pointerdown', (e) => { tr.setPointerCapture(e.pointerId); film.wasPlaying = film.playing; film.playing = false; set(e); Sound.blip('tick') })
    tr.addEventListener('pointermove', (e) => { if (tr.hasPointerCapture(e.pointerId)) set(e) })
    tr.addEventListener('pointerup', () => { film.playing = film.wasPlaying && film.t < 1; filmRender() })
  }

  // ---- FORGE ----

  let searchTimers = []
  S.matchmaking = {
    pose: 'matchmaking', parent: 'main', crumb: () => 'Main menu › <b>Matchmaking</b>',
    html: () => `
      <div class="scr-head holo"><h1 class="scr-title">Matchmaking</h1><p class="scr-sub">Playlists · ${work.length} online</p></div>
      <div class="split">
        <div class="panel listp holo"><h2 class="ph">Playlists <small>vercel.com</small></h2>
          <ul class="list">${work.map((w, i) => `<li><button class="li" data-nav data-i="${i}">${BAR}<span class="n">${pad2(i + 1)}</span><span class="t">${esc(w.title)}</span><span class="m">${w.d.getFullYear()}</span></button></li>`).join('')}</ul>
          <div class="list-foot"><span>Ranked: off</span><span>Region: worldwide</span></div></div>

  }
  function renderPlaylist(i) {
    const w = work[i]; if (!w) return
    const d = $('#mm-detail'); d.className = 'panel detail'
    d.innerHTML = `
      <h2 class="ph">Playlist <small>Season ${w.d.getFullYear()}</small></h2>
      <div class="mm-card">
        <div class="mm-idle" style="display:flex;flex-direction:column;gap:16px">
          <span class="lab" style="margin:0;color:var(--amber)">${fmtDate(w.d)}</span>
          <h3 class="mm-title">${esc(w.title)}</h3>
          <p class="intel" style="margin:0">${esc(w.description)}</p>

          <div style="display:flex;gap:12px;align-items:center;margin-top:6px"><span class="key">↵</span><span class="lab" style="margin:0">Search for match</span></div>
        </div>
        <div class="search" aria-live="polite">
          <svg class="spinner" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" stroke="rgba(150,205,255,.15)"/><circle cx="60" cy="60" r="54" stroke="#c4ecff" stroke-dasharray="60 280" stroke-linecap="square"><animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="60" cy="60" r="42" stroke="#ffc46b" stroke-dasharray="20 244" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="60" cy="60" r="4" fill="#c4ecff" stroke="none"/></svg>
          <div class="s-status" id="s-status">Searching</div>
          <div class="s-sub" id="s-sub">${esc(w.title)}</div>
          <ul class="s-log" id="s-log"></ul>
          <div id="s-act" style="display:flex;gap:12px"></div>
        </div>
      </div>`
  }
  function startSearch(i) {
    const w = work[i]; const d = $('#mm-detail'); if (!w || !d) return
    S.matchmaking.sel = i; renderPlaylist(i); d.classList.add('searching')
    if (matchMedia('(max-width: 760px)').matches) d.scrollIntoView({ behavior: 'smooth', block: 'start' })
    const log = (t) => { const li = document.createElement('li'); li.className = 'ok'; li.textContent = t; $('#s-log')?.appendChild(li); Sound.blip('tick') }
    const sub = (t) => { const el = $('#s-sub'); if (el) el.textContent = t }
    const steps = [

    else if (k === 'left') horizontal(-1); else if (k === 'right') horizontal(1)
    else if (k === 'a') activate(); else if (k === 'b') back()
    else if (k === 'y') setSound(!prefs.sound)
    else if (k === 'lb') Nav.move(-8); else if (k === 'rb') Nav.move(8)
    else if (k === 'start' && cur.name === 'film') { film.playing = !film.playing; filmRender() }
  }
  requestAnimationFrame(pollPad)
  window.addEventListener('gamepadconnected', () => lastInputSet('pad'))

  window.addEventListener('resize', () => {
    if (!cur) return
    if (cur.name === 'campaign' || cur.name === 'theater') Nav.refresh()
  })

  // ---------------- boot ----------------
  Render.onStats(({ fps, scale, kind }) => {
    $('#fps').textContent = `${Math.round(fps)} FPS · ${Math.round(scale * 100)}% · ${kind.toUpperCase()}`
    if (cur?.name === 'settings') renderSys()
  })
  if (Q.has('noui')) document.getElementById('app').style.display = 'none'
  const deep = location.hash.length > 1 || Q.has('nostart')
  Render.init(document.getElementById('bg'), { pose: Q.get('pose') || (deep ? (parseHash()[0] === 'main' ? 'main' : S[parseHash()[0]].pose) : 'title'), quality: prefs.quality, reducedMotion: prefs.motion === 'reduced' }).then(() => {
    window.__ready = true
    const d = $('#menu-desc'); if (d && cur?.name === 'main') d.innerHTML = MENU[cur.sel][2]()
  })
  applyPrefs('music'); applyPrefs('sfx'); applyPrefs('fps')
  setSound(false, true); prefs.sound = store.get().sound || false
  for (const b of [$('#snd'), $('#title-snd')]) { b.classList.toggle('on', false) }
  if (deep) { $('#title').hidden = true; start() }
  else setTimeout(() => $('#press-start').focus({ preventScroll: true }), 50)
})()

</script>
</body>
</html>

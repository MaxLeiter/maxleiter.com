    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const dirs = { L: b(14) || ax < -.55 || b(4), R: b(15) || ax > .55 || b(5), U: b(12) || ay < -.55, D: b(13) || ay > .55 };
    for (const [k, on] of Object.entries(dirs)) {
      const r = pad.rep[k] || (pad.rep[k] = { on: false, next: 0 });
      if (on && (!r.on || now >= r.next)) { r.next = now + (r.on ? 130 : 380); r.on = true; synth(k); } else if (!on) r.on = false;
    }
    const press = i => b(i) && !pad.prev[i];
    if (press(0)) synthKey('Enter'); if (press(1)) synthKey('Escape'); if (press(9) || press(8) || press(16)) synthKey('g');
    pad.prev = gp.buttons.map(x => x.pressed);
    pad.raf = requestAnimationFrame(loop);
  };
  const synth = k => synthKey({ L: 'ArrowLeft', R: 'ArrowRight', U: 'ArrowUp', D: 'ArrowDown' }[k]);
  pad.raf = requestAnimationFrame(loop);
}
function synthKey(key) { document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true })); }

/* ================= ambient background (OffscreenCanvas worker, main-thread fallback) ================= */
const bg = (() => {
  const canvas = $('#bg'), src = $('#bgsrc').textContent; let api = null, worker = null, mainR = null, mraf = 0, mlast = 0, still = reduceMotion;
  const size = () => { const k = Math.min(devicePixelRatio || 1, 1.5) * .5; return [innerWidth * k, innerHeight * k]; };
  try {
    if (!canvas.transferControlToOffscreen) throw 0;
    const blob = new Blob([src + `
      let r = null, still = false, last = 0;
      const raf = self.requestAnimationFrame ? f => self.requestAnimationFrame(f) : f => setTimeout(() => f(performance.now()), 16);
      function loop(now) { const dt = last ? Math.max(0, Math.min(.05, (now - last) / 1000)) : .016; last = now; r.frame(dt); if (!still) raf(loop); else last = 0; }
      onmessage = e => { const m = e.data;
        if (m.type === 'init') { r = createRenderer(m.canvas.getContext('2d')); r.resize(m.w, m.h); r.setColor(m.color, true); still = m.still; r.frame(.016); if (!still) raf(loop); }
        else if (m.type === 'resize') { r.resize(m.w, m.h); r.frame(0); }
        else if (m.type === 'color') { r.setColor(m.color, still); if (still) r.frame(0); }
        else if (m.type === 'still') { const was = still; still = m.still; if (was && !still) raf(loop); else r.frame(0); } };`], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    const off = canvas.transferControlToOffscreen(); const [w, h] = size();
    worker.postMessage({ type: 'init', canvas: off, w, h, color: BLADES[state.blade].rgb, still }, [off]);
    api = { color: c => worker.postMessage({ type: 'color', color: c }), resize: () => { const [w, h] = size(); worker.postMessage({ type: 'resize', w, h }); }, still: v => worker.postMessage({ type: 'still', still: v }) };
    canvas.dataset.mode = 'worker';
  } catch (err) {
    const create = new Function(src + '; return createRenderer;')();
    mainR = create(canvas.getContext('2d')); const [w, h] = size(); mainR.resize(w, h); mainR.setColor(BLADES[state.blade].rgb, true); mainR.frame(.016);
    const loop = now => { const dt = mlast ? Math.max(0, Math.min(.05, (now - mlast) / 1000)) : .016; mlast = now; mainR.frame(dt); if (!still) mraf = requestAnimationFrame(loop); else mlast = 0; };
    if (!still) mraf = requestAnimationFrame(loop);
    api = { color: c => { mainR.setColor(c, still); if (still) mainR.frame(0); }, resize: () => { const [w, h] = size(); mainR.resize(w, h); mainR.frame(0); }, still: v => { const was = still; still = v; if (was && !v) mraf = requestAnimationFrame(loop); } };
    canvas.dataset.mode = 'main';
  }
  return api;
})();

/* ================= clock, resize, boot ================= */
const clockText = () => new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const tickClock = () => { $('#clock').textContent = clockText(); };
tickClock(); setInterval(tickClock, 15000);
reduced.addEventListener('change', e => setMotion(e.matches));
addEventListener('resize', () => { measure(); layout(); bg.resize(); });
document.addEventListener('visibilitychange', () => bg.still(document.hidden || reduceMotion));

measure();
BLADES.forEach((b, i) => select(i, 0, { instant: true, silent: true, force: true }));
setActiveUI(); spring.snap(); layout();
if (reduceMotion) setMotion(true);
const params = new URLSearchParams(location.search);
if (params.has('blade')) { const i = BLADES.findIndex(b => b.id === params.get('blade')); if (i >= 0) { state.blade = i; spring.target = i; spring.snap(); setActiveUI(); layout(); } }
window.__mid = x => { spring.x = spring.target = x; spring.v = -2.5; layout(); }; // screenshot hook: freeze a mid-swing pose
if (!params.has('notoast')) setTimeout(() => toast('New post', posts[0].title, () => { goBlade(1, { silent: true }); select(1, 0, { silent: true }); openReader(1, posts[0], blades[1].pvBox); }), 1600);
})();
</script>

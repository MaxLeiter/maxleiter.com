<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max Leiter — Wave</title>
<meta name="description" content="Max Leiter's site as a mid-2000s console menu, with articles rendered through HTML-in-Canvas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f4f8ff;
  --ink-dim: rgba(240, 246, 255, .62);
  --ink-faint: rgba(240, 246, 255, .38);
  --glow: 0 0 7px rgba(255, 255, 255, .45), 0 1px 2px rgba(0, 0, 0, .35);
  --font: "M PLUS 1p", "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --t: .32s;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #071233; }
body {
  font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}
/* when WebGL2 is unavailable the body itself carries the gradient */
body.nogl { background: linear-gradient(180deg, var(--c0, #0a2f75), var(--c1, #1b5fb0) 55%, var(--c2, #071a46)); }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------------- article sheet (shared by both render paths) ---------------- */
.sheet {
  width: 720px; padding: 26px 4px 40px; color: #eef4ff; font: 400 16.5px/1.72 var(--font);
  user-select: text; -webkit-user-select: text; background: transparent; outline: none;
}
.sheet .sh-head { display: flex; gap: 18px; align-items: flex-start; padding-bottom: 18px; margin-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.18); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.sheet .sh-ic { flex: 0 0 64px; width: 64px; height: 64px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
.sheet .sh-ic svg { width: 100%; height: 100%; display: block; }
.sheet .sh-kicker { font-size: 13px; letter-spacing: .06em; color: rgba(225,236,255,.7); text-transform: uppercase; }
.sheet h1 { font-size: 30px; line-height: 1.22; font-weight: 500; margin: 2px 0 6px; color: #fff;
  text-shadow: 0 0 12px rgba(255,255,255,.28); letter-spacing: .005em; }
.sheet .sh-desc { margin: 0; color: rgba(230,240,255,.78); font-size: 15.5px; }
.sheet h2, .sheet h3 { font-weight: 500; color: #fff; margin: 1.6em 0 .5em; line-height: 1.3; }
.sheet h2 { font-size: 22px; } .sheet h3 { font-size: 18.5px; }
.sheet p { margin: 0 0 1em; }
.sheet ul, .sheet ol { margin: 0 0 1em; padding-left: 1.4em; }
.sheet li { margin: .2em 0; }
.sheet a { color: #9fd4ff; text-decoration: underline; text-decoration-color: rgba(159,212,255,.45); text-underline-offset: 3px; }
.sheet a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 3px; }
.sheet code { font: 14px/1.5 var(--mono); background: rgba(0,10,30,.45); border: 1px solid rgba(255,255,255,.12);
  padding: 1px 5px; border-radius: 4px; }
.sheet pre { margin: 1.2em 0; padding: 14px 18px; border-radius: 8px; overflow: hidden; white-space: pre-wrap;
  background: linear-gradient(180deg, rgba(0,6,20,.72), rgba(0,12,32,.6)); border: 1px solid rgba(255,255,255,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 8px 18px rgba(0,0,0,.35); }
.sheet pre code { background: none; border: 0; padding: 0; font-size: 13.5px; color: #dfe9ff; }
.sheet .k { color: #8fd0ff; } .sheet .s { color: #ffd59a; } .sheet .c { color: rgba(220,230,255,.45); }
.sheet .sh-more { margin-top: 1.6em; font-size: 15px; }
.sheet .sh-more a { display: inline-flex; gap: 8px; align-items: center; padding: 8px 16px; border-radius: 999px;
  text-decoration: none; color: #fff; background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 8px rgba(0,0,0,.25); }
.sheet .sh-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 15px; margin: 0 0 1em; }
.sheet .sh-grid dt { color: rgba(225,236,255,.6); } .sheet .sh-grid dd { margin: 0; }
.sheet .ellip { color: rgba(230,240,255,.55); }
.sheet ::selection { background: rgba(120,190,255,.55); color: #fff; }

/* ---------------- DOM-overlay fallback panel ---------------- */
#glass { position: fixed; z-index: 4; border-radius: 16px; overflow: hidden; visibility: hidden; opacity: 0;
  transform-origin: var(--ox, 50%) var(--oy, 50%);
  background: linear-gradient(180deg, rgba(14,26,58,.52), rgba(4,10,28,.66));
  -webkit-backdrop-filter: blur(18px) saturate(1.35) brightness(.9); backdrop-filter: blur(18px) saturate(1.35) brightness(.9);
  border: 1px solid rgba(255,255,255,.34);
  box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.04);
  transition: opacity .25s ease, visibility 0s linear .3s; }
#glass.on { visibility: visible; opacity: 1; transition: opacity .2s ease; animation: jelly .9s var(--ease) both; }
#glass::before { content: ""; position: absolute; inset: 0 0 auto; height: 120px; pointer-events: none; z-index: 2;
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0)); }
#glass::after { content: ""; position: absolute; inset: -40%; pointer-events: none; z-index: 2; opacity: .9;
  background: linear-gradient(115deg, transparent 44%, rgba(255,255,255,.12) 50%, transparent 56%);
  transform: translateX(-70%); }
#glass.on::after { animation: sheen 8s linear .35s infinite; }
#glass .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 0 var(--pad, 40px);
  overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent);
          mask-image: linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent); }
#glass .scroller .sheet { width: auto; transform: skewY(calc(var(--vel, 0) * .02deg)); transform-origin: 50% 0; }
@keyframes jelly {
  0% { transform: translate(var(--fx, 0), var(--fy, 0)) scale(.55) perspective(900px) rotateX(16deg); }
  45% { transform: scale(1.025, .985) perspective(900px) rotateX(-2deg); }
  70% { transform: scale(.992, 1.008); }
  100% { transform: none; }
}
@keyframes sheen { 0% { transform: translateX(-70%); } 30%, 100% { transform: translateX(70%); } }

/* ---------------- console menu ---------------- */
#ui { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#ui button, #ui a, #ui .hit { pointer-events: auto; }
#menu { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0;
  transition: opacity .35s ease, filter .35s ease; }
body.open #menu { opacity: .16; filter: blur(3px); }
body.open.hic #menu { opacity: 0; }
body.open #menu * { pointer-events: none !important; }
.cat { position: absolute; left: 0; top: 0; width: 120px; height: 140px; margin: 0; padding: 0; border: 0; background: none;
  color: inherit; font: inherit; cursor: pointer; transition: transform var(--t) var(--ease), opacity var(--t) ease;
  will-change: transform; outline: none; }
.cat .ic { position: absolute; left: 22px; top: 0; width: 76px; height: 76px; transform: scale(.7); transform-origin: 50% 50%;
  transition: transform var(--t) var(--ease), filter var(--t) ease; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
.cat .ic svg { width: 100%; height: 100%; display: block; }
.cat .lbl { position: absolute; left: -30px; right: -30px; top: 82px; text-align: center; font-size: 17px; font-weight: 400;
  text-shadow: var(--glow); opacity: 0; transition: opacity var(--t) ease; letter-spacing: .02em; }
.cat.on .ic { transform: scale(1); filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)) drop-shadow(0 0 10px rgba(255,255,255,.35)); }
.cat.on .lbl { opacity: 1; }
.cat:not(.on) { opacity: .72; }
.cat:focus-visible .ic { outline: 2px solid rgba(255,255,255,.7); outline-offset: 4px; border-radius: 12px; }

.list { position: absolute; left: 0; top: 0; transition: opacity .25s ease; }
.list[hidden] { display: block; opacity: 0; visibility: hidden; }
.item { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 0; width: 720px; height: 64px;
  color: inherit; text-decoration: none; cursor: pointer; outline: none;
  transition: transform var(--t) var(--ease), opacity var(--t) ease; will-change: transform; }
.item .ic { flex: 0 0 76px; width: 76px; height: 76px; transform: scale(.62); transition: transform var(--t) var(--ease), filter var(--t) ease;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.item .ic svg { width: 100%; height: 100%; display: block; }
.item .tx { margin-left: 14px; min-width: 0; flex: 1; }
.item .t, .item .s { display: block; }
.item .t { font-size: 20px; font-weight: 400; line-height: 1.25; text-shadow: 0 1px 3px rgba(0,0,0,.4); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; opacity: .8; transition: opacity var(--t) ease; }
.item .s { font-size: 14px; color: var(--ink-dim); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-height: 0; opacity: 0; transition: opacity var(--t) ease, max-height var(--t) ease; }
.item .v { margin-left: 18px; font-size: 18px; color: var(--ink-dim); white-space: nowrap; opacity: .85; }
.item.on .ic { transform: scale(1); filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)) drop-shadow(0 0 12px rgba(255,255,255,.42)); }
.item.on .t { opacity: 1; font-weight: 500; text-shadow: var(--glow); }
.item.on .s { max-height: 22px; opacity: 1; }
.item.on .v { color: var(--ink); text-shadow: var(--glow); }
.item.up .t { opacity: .62; }
.item.on::before { content: ""; position: absolute; left: -6px; top: -8px; width: 88px; height: 88px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.22), rgba(255,255,255,0)); pointer-events: none; }

/* ---------------- chrome: clock, badge, hints ---------------- */
#clock { position: absolute; right: 36px; top: 26px; display: flex; gap: 14px; align-items: baseline; font-size: 16px;
  text-shadow: var(--glow); letter-spacing: .03em; font-weight: 300; }
#clock b { font-weight: 400; font-size: 19px; }
#clock .line { position: absolute; right: -36px; left: -18px; bottom: -8px; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5)); }
#snd { position: absolute; right: 34px; top: 66px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
  background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.22), rgba(255,255,255,.04)); color: #fff; cursor: pointer; padding: 0;
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); opacity: .8; }
#snd svg { width: 18px; height: 18px; }
#snd:hover, #snd:focus-visible { opacity: 1; outline: none; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
#hints { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 22px; font-size: 13.5px;
  color: var(--ink-dim); text-shadow: 0 1px 2px rgba(0,0,0,.4); flex-wrap: wrap; padding: 0 140px; }
#hints span { display: inline-flex; align-items: center; gap: 7px; }
#hints kbd { font: 500 11px/1 var(--font); min-width: 22px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center;
  border-radius: 6px; color: #fff; background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,.08));
  border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
#hints button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
#hints .touch { display: none; } body.phone #hints .touch { display: inline-flex; } body.phone #hints .when-menu:not(.touch) { display: none; }
#hints .when-open { display: none; } body.open #hints .when-open { display: inline-flex; } body.open #hints .when-menu { display: none; }
#badge { position: absolute; right: 18px; bottom: 16px; display: inline-flex; white-space: nowrap; align-items: center; gap: 7px; font-size: 11px;
  padding: 5px 10px 5px 8px; border-radius: 999px; color: rgba(255,255,255,.85); letter-spacing: .03em; pointer-events: auto;
  background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); cursor: help; }
#badge i { width: 7px; height: 7px; border-radius: 50%; background: #ffc35a; box-shadow: 0 0 6px #ffc35a; }
#badge.hic i { background: #7dffb0; box-shadow: 0 0 6px #7dffb0; }
#live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------------- phone ---------------- */
body.phone .item { width: calc(100vw - 72px); }
body.phone .item .t { font-size: 17px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
body.phone .item .s { font-size: 12.5px; }
body.phone .item .v { font-size: 15px; margin-left: 8px; }
body.phone .item .ic, body.phone .cat .ic { width: 60px; height: 60px; flex-basis: 60px; }
body.phone .cat { width: 90px; } body.phone .cat .ic { left: 15px; } body.phone .cat .lbl { top: 64px; font-size: 15px; }
body.phone .item.on::before { width: 70px; height: 70px; left: -5px; top: -3px; }
body.phone #clock { right: 18px; top: 18px; font-size: 14px; } body.phone #clock b { font-size: 16px; }
body.phone #snd { right: 16px; top: 52px; }
body.phone.open #snd { display: none; }
body.phone #hints { padding: 0 12px; bottom: 46px; gap: 14px; font-size: 12.5px; }
body.phone #hints .kb { display: none; }
body.phone #badge { left: 50%; right: auto; transform: translateX(-50%); bottom: 14px; }
body.phone .sheet { font-size: 15.5px; }
body.phone .sheet h1 { font-size: 23px; }
body.phone .sheet .sh-ic { flex-basis: 46px; width: 46px; height: 46px; }

body.rm *, body.rm *::before, body.rm *::after { transition-duration: .01s !important; animation: none !important; }
</style>
</head>
<body>
<!-- The stage. With HTML-in-Canvas the article sheet is a child of this canvas and is drawn into it. -->
<canvas id="stage" aria-label="Article"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3f9"/><stop offset="1" stop-color="#c3cfdd"/>
    </linearGradient>
    <linearGradient id="ig2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafd"/><stop offset="1" stop-color="#aebdcf"/>
    </linearGradient>
    <linearGradient id="ig3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e3ee"/><stop offset="1" stop-color="#93a6bc"/>
    </linearGradient>
    <linearGradient id="ish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iglobe" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dfe7f1"/><stop offset="1" stop-color="#9fb1c6"/>
    </radialGradient>
  </defs>
  <filter id="fx-ripple" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.003 0.016" numOctaves="1" seed="7" result="n"/>
    <feDisplacementMap id="fx-disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="glass" aria-hidden="true"><div class="scroller" tabindex="-1"></div></div>

<div id="ui">
  <div id="menu" role="application" aria-roledescription="console menu" aria-label="Max Leiter">
    <div id="cats" role="tablist" aria-label="Categories"></div>
    <div id="lists"></div>
  </div>
  <div id="clock" aria-hidden="true"><span id="cdate"></span><b id="ctime"></b><span class="line"></span></div>
  <button id="snd" type="button" aria-pressed="false" aria-label="Sound off. Turn sound on"></button>
  <div id="hints">
    <span class="when-menu kb"><kbd>←</kbd><kbd>→</kbd> Category</span>
    <span class="when-menu kb"><kbd>↑</kbd><kbd>↓</kbd> Select</span>
    <span class="when-menu"><kbd>↵</kbd> Open</span>
    <span class="when-menu touch">Swipe to browse · tap to open</span>
    <span class="when-open kb"><kbd>↑</kbd><kbd>↓</kbd> Scroll</span>
    <button class="when-open hit" type="button" id="back"><kbd>Esc</kbd> Back</button>
  </div>
  <div id="badge" title="" tabindex="0"><i></i><span id="badge-t">Detecting…</span></div>
  <div id="live" aria-live="polite"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
'use strict'
const DATA = JSON.parse(document.getElementById('data').textContent)
const SITE = 'https://maxleiter.com'
const $ = (s) => document.querySelector(s)
const qs = new URLSearchParams(location.search)
const reducedMQ = matchMedia('(prefers-reduced-motion: reduce)')

/* =====================================================================
   Icons — original glossy line icons, drawn here, no assets.
   ===================================================================== */
const G = 'url(#ig)', G2 = 'url(#ig2)', G3 = 'url(#ig3)', LN = '#8ea2b9', SH = 'url(#ish)'
const ICONS = {
  about: `<circle cx="32" cy="19" r="11" fill="${G}"/><path d="M11 56c0-13 9-21 21-21s21 8 21 21z" fill="${G}"/>

    <g fill="none" stroke="${G3}" stroke-width="3"><path d="M21 15V7"/><path d="M29 15V7"/><path d="M37 15V7"/><path d="M45 15V7"/></g>
    <rect x="13" y="13" width="38" height="5" fill="#fff" opacity=".7"/>`,

    <path d="M32 6l22 12-22 12-22-12z" fill="${SH}" opacity=".6"/><path d="M21 12l22 12" stroke="#fff" stroke-width="1.5" opacity=".7"/>`,

  doc: `<path d="M16 6h23l11 11v41H16z" fill="${G}"/><path d="M39 6v11h11z" fill="${G3}"/>
    <path d="M23 27h20M23 34h20M23 41h20M23 48h12" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/>`,
  note: `<path d="M11 11h42v30L39 55H11z" fill="${G}"/><path d="M53 41H39v14z" fill="${G3}"/>
    <path d="M19 23h26M19 31h26M19 39h14" stroke="${LN}" stroke-width="2.6" stroke-linecap="round"/><rect x="11" y="11" width="42" height="6" fill="${G3}"/>`,
  cube: `<path d="M32 8l20 11-20 11-20-11z" fill="#fff"/><path d="M12 19l20 11v24L12 43z" fill="${G2}"/><path d="M52 19L32 30v24l20-11z" fill="${G3}"/>`,
  globe: `<circle cx="32" cy="32" r="23" fill="url(#iglobe)"/><g fill="none" stroke="${LN}" stroke-width="2"><ellipse cx="32" cy="32" rx="10" ry="23"/>
    <path d="M9 32h46M13 20h38M13 44h38"/></g><ellipse cx="25" cy="20" rx="9" ry="5" fill="${SH}" opacity=".7"/>`,
  person: `<circle cx="32" cy="21" r="10" fill="${G}"/><path d="M13 55c0-12 8-19 19-19s19 7 19 19z" fill="${G}"/>`,

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

    if (fence) { if (/^\s*```/.test(l)) { out.push(`<pre><code>${esc(fence.join('\n'))}</code></pre>`); fence = null } else fence.push(raw); continue }
    if (/^\s*```/.test(l)) { flushP(); flushL(); fence = []; continue }
    if (!l.trim()) { flushP(); flushL(); continue }
    if (/^\s*!\[/.test(l) || /^\s*</.test(l) || /^Click to expand$/.test(l.trim())) { flushP(); continue }

    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {

/* layout: menu is designed on a 1280×720 board and scaled; phone gets its own board */
let W = innerWidth, H = innerHeight, PHONE = false, SCALE = 1
function layout() {
  W = innerWidth; H = innerHeight; PHONE = W < 700
  document.body.classList.toggle('phone', PHONE)
  const menu = $('#menu')
  let bw, bh, catX, rowY, catGap, ic, itemGap, firstGap
  if (PHONE) {
    SCALE = 1; bw = W; bh = H; catX = 54; rowY = Math.max(128, H * 0.17); catGap = 96; ic = 60; itemGap = 66; firstGap = 64
  } else {
    SCALE = Math.min(W / 1280, H / 720); if (SCALE > 1) SCALE = Math.min(SCALE, 1.6)
    bw = W / SCALE; bh = H / SCALE; catX = Math.max(220, bw * 0.235); rowY = bh * 0.262; catGap = 150; ic = 76; itemGap = 64; firstGap = 80
  }
  menu.style.width = bw + 'px'; menu.style.height = bh + 'px'; menu.style.transform = `scale(${SCALE})`
  const cw = PHONE ? 90 : 120
  catEls.forEach((el, i) => {
    const d = i - state.cat
    const x = catX + d * catGap - cw / 2 + (d < 0 ? -10 : d > 0 ? 8 : 0)
    el.style.transform = `translate3d(${x}px, ${rowY - ic / 2}px, 0)`

  })
  listEls.forEach((l, ci) => {
    const on = ci === state.cat
    l.hidden = !on
    l.style.transform = `translate3d(${catX - ic / 2}px, 0, 0)`
    const sel = state.sel[ci]
    itemEls[ci].forEach((el, ii) => {
      const d = ii - sel
      let y
      if (d === 0) y = rowY + firstGap
      else if (d > 0) y = rowY + firstGap + 22 + d * itemGap
      else y = rowY - ic / 2 - 26 - (-d) * itemGap
      el.style.transform = `translate3d(0, ${y - 6}px, 0)`
      el.classList.toggle('on', d === 0); el.classList.toggle('up', d < 0)
      const fade = Math.max(0, Math.min(1, (bh - (PHONE ? 110 : 64) - y) / 110, (y + 30) / 110))

  if (kind === 'cat') { blip(1500, 1100, 0.07, 0.06); blip(3000, 2200, 0.03, 0.015, 'triangle') }
  if (kind === 'open') { blip(660, 990, 0.32, 0.045); blip(990, 1320, 0.36, 0.03, 'sine', 0.05); whoosh(0.35, 0.03, 900, 3200) }

/* =====================================================================

   legacy (Chromium ~138–145): <canvas layoutsubtree>, ctx.drawElement / drawElementImage,
     gl.texElement2D / texElementImage2D(target, level, ifmt, fmt, type, el),
     ResizeObserver {fireOnEveryPaint}, ctx.setHitTestRegions([...])

     requestPaint(), gl.texElementSubImage2D(target, level, x, y, el), getElementImageDefaultSize,
     canvas.updateElementGeometry(el, {canvasTransform, canvasClip}), getElementTransform

  const C = HTMLCanvasElement.prototype
  const W2 = window.WebGL2RenderingContext?.prototype || {}
  const X2 = window.CanvasRenderingContext2D?.prototype || {}
  const has = (o, n) => typeof o[n] === 'function'
  let fireOnEveryPaint = false
  try { const ro = new ResizeObserver(() => {}); ro.observe(document.documentElement, { get fireOnEveryPaint() { fireOnEveryPaint = true; return true } }); ro.disconnect() } catch {}
  const names = {
    'canvas.layoutSubtree': 'layoutSubtree' in C, 'canvas.content (drawable)': 'content' in C,
    'canvas.requestPaint()': has(C, 'requestPaint'), 'canvas.onpaint': 'onpaint' in C,
    'canvas.updateElementGeometry()': has(C, 'updateElementGeometry'), 'canvas.getElementTransform()': has(C, 'getElementTransform'),
    'canvas.captureElementImage()': has(C, 'captureElementImage'), 'canvas.getElementImageDefaultSize()': has(C, 'getElementImageDefaultSize'),
    'ctx2d.drawElementImage()': has(X2, 'drawElementImage'), 'ctx2d.drawElement()': has(X2, 'drawElement'), 'ctx2d.drawHTMLElement()': has(X2, 'drawHTMLElement'),
    'ctx2d.setHitTestRegions()': has(X2, 'setHitTestRegions'),
    'gl2.texElementSubImage2D()': has(W2, 'texElementSubImage2D'), 'gl2.texElementImage2D()': has(W2, 'texElementImage2D'),
    'gl2.texElement2D()': has(W2, 'texElement2D'), 'gl2.texHTMLElement2D()': has(W2, 'texHTMLElement2D'),
    'gl2.setHitTestRegions()': has(W2, 'setHitTestRegions'), 'ResizeObserver {fireOnEveryPaint}': fireOnEveryPaint,
  }
  const lines = Object.entries(names).map(([k, v]) => `${v ? '✓' : '·'} ${k}`)
  const modern = names['canvas.requestPaint()'] && (names['gl2.texElementSubImage2D()'] || names['gl2.texElementImage2D()'])
  const legacy = names['canvas.layoutSubtree'] && (names['gl2.texElementImage2D()'] || names['gl2.texElement2D()'] || names['gl2.texHTMLElement2D()'])
  const gen = modern ? 'current (paint event)' : legacy ? 'legacy (layoutsubtree)' : null

const VS_PT = `#version 300 es

in float aId; uniform vec2 uRes; uniform float uT, uDpr, uDof;

const FS_PANEL = `#version 300 es

  col += vec3(1.) * .14 * exp(-pow((s - sweep) / 80., 2.)) * uMotion;
  col += vec3(1.) * .05 * exp(-pow((s - sweep + 140.) / 26., 2.)) * uMotion;

    float m = smoothstep(uContent.y, uContent.y + 20., qd.y) * (1. - smoothstep(uContent.y + uContent.w - 20., uContent.y + uContent.w, qd.y));

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false)

/* --- keep hit testing / accessibility geometry in sync with where we draw --- */
let lastGeom = ''

function panelLayout() {
  let x, y, w, h, pad

  else { w = Math.min(880, W - 96); x = (W - w) / 2; y = Math.max(70, H * 0.1); h = H - y - Math.max(62, H * 0.09); pad = 44 }

}
RENDER.layout = () => { if (state.open) panelLayout() }

function openSheet(cat, it) {
  const ci = state.cat, ii = state.sel[ci]

  const r = itemEls[ci][ii].querySelector('.ic').getBoundingClientRect()
  P.from = [r.left + r.width / 2, r.top + r.height / 2]

}
function closeSheet() {

  itemEls[state.cat][state.sel[state.cat]].focus({ preventScroll: true })
  announce(`Closed ${it.title}`)
}
$('#back').addEventListener('click', closeSheet)

/* =====================================================================
   Input: keyboard, wheel, touch/pointer, gamepad
   ===================================================================== */
function scrollBy(dy, x, y, amp) {

addEventListener('keydown', (e) => {

    if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); closeSheet() }
    else if (HIC.active) {
      if (k === 'ArrowDown') { e.preventDefault(); scrollBy(70, undefined, undefined, 0.35) }
      else if (k === 'ArrowUp') { e.preventDefault(); scrollBy(-70, undefined, undefined, 0.35) }
      else if (k === 'PageDown' || (k === ' ' && !e.shiftKey)) { e.preventDefault(); scrollBy(page, undefined, undefined, 0.9) }

  else if (k === 'ArrowLeft') { e.preventDefault(); setCat(state.cat - 1) }

  else if (k === 'ArrowUp') { e.preventDefault(); setSel(state.sel[state.cat] - 1) }
  else if (k === 'Home') { e.preventDefault(); setSel(0) }
  else if (k === 'End') { e.preventDefault(); setSel(1e6) }

    if (document.activeElement === $('#snd') || document.activeElement?.closest?.('#hints')) return

    e.preventDefault(); activate()
  }
})
// keep keyboard focus visible inside the canvas sheet: scroll focused links into view
sheet.addEventListener('focusin', (e) => {
  if (!HIC.active || e.target === sheet) return
  let y = 0, n = e.target; while (n && n !== sheet) { y += n.offsetTop; n = n.offsetParent }
  if (y < P.target + 30 || y > P.target + P.content[3] - 60) { P.target = Math.max(0, Math.min(P.max, y - P.content[3] * 0.4)) }
})

let wheelAcc = 0, wheelT = 0
addEventListener('wheel', (e) => {
  const dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY
  if (state.open) {
    if (HIC.active) { e.preventDefault(); scrollBy(dy, e.clientX, e.clientY, Math.min(1.2, Math.abs(dy) / 160)) }
    return
  }
  e.preventDefault()
  const t = performance.now(); if (t - wheelT > 300) wheelAcc = 0
  wheelT = t; wheelAcc += dy

}, { passive: false })

// pointer: swipes on the menu, drag-scroll + text selection on the canvas sheet
let ptr = null, lastSwipe = 0
const swiped = () => performance.now() - lastSwipe < 350
const inRect = (x, y, r) => x >= r[0] && y >= r[1] && x <= r[0] + r[2] && y <= r[1] + r[3]

})

    if (c && sheet.contains(c.node)) getSelection().extend(c.node, c.off)

    else if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) { lastSwipe = performance.now(); setSel(state.sel[state.cat] + Math.round(-dy / 60) || (dy < 0 ? 1 : -1)) }

addEventListener('dblclick', (e) => {
  if (!state.open || !HIC.active || !inRect(e.clientX, e.clientY, P.content)) return
  const s = getSelection(); const c = caretAt(e.clientX, e.clientY)
  if (!c || !sheet.contains(c.node)) return

let fbLast = 0, fbVel = 0
$('#glass .scroller').addEventListener('scroll', (e) => { const st = e.target.scrollTop; fbVel += (st - fbLast); fbLast = st }, { passive: true })

// gamepad: d-pad / left stick to move, south button to open, east to go back
const pad = { held: {}, next: {} }
function pollPad(t) {
  const gps = navigator.getGamepads ? navigator.getGamepads() : []
  for (const gp of gps) {
    if (!gp) continue
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0
    const dirs = { up: gp.buttons[12]?.pressed || ay < -0.55, down: gp.buttons[13]?.pressed || ay > 0.55,
      left: gp.buttons[14]?.pressed || ax < -0.55, right: gp.buttons[15]?.pressed || ax > 0.55,
      ok: gp.buttons[0]?.pressed, back: gp.buttons[1]?.pressed }
    for (const [k, on] of Object.entries(dirs)) {
      if (!on) { pad.held[k] = false; continue }
      if (!pad.held[k] || (t > pad.next[k] && !['ok', 'back'].includes(k))) {
        pad.next[k] = t + (pad.held[k] ? 90 : 380); pad.held[k] = true
        const map = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', ok: 'Enter', back: 'Escape' }
        dispatchEvent(new KeyboardEvent('keydown', { key: map[k] }))

/* =====================================================================
   Frame loop
   ===================================================================== */
const T0 = performance.now()
const now = () => window.__tfix ?? (performance.now() - T0) / 1000  // __tfix: frozen clock for screenshot poses
let tWave = qs.has('t') ? +qs.get('t') : (Date.now() / 1000) % 600, lastT = 0, dof = 0, fps = { n: 0, t: 0, v: 0 }

reducedMQ.addEventListener?.('change', (e) => { state.motion = e.matches ? 'reduced' : 'full'; applyMotion(); layout() })

function frame(ms) {
  const t = now(), dt = Math.min(0.05, t - lastT); lastT = t

  const open = !!state.open && !P.closing
  dof += ((open ? 1 : 0) - dof) * Math.min(1, dt * 7)
  if (state.open) {
    if (P.closing) P.prog = state.motion === 'full' ? Math.max(0, 1 - (t - P.closeAt) / 0.32) : 0
    else if (P.ready || !HIC.active) P.prog = Math.min(1, P.prog + dt / 0.62)
    if (window.__hold != null) { P.prog = window.__hold; P.openAt = t - window.__hold * 0.62 }
    const prev = P.scroll
    P.scroll += (P.target - P.scroll) * Math.min(1, dt * 12)
    if (Math.abs(P.target - P.scroll) < 0.3) P.scroll = P.target
    const v = (P.scroll - prev) / Math.max(dt, 1e-3) / 60

  }
  if (!HIC.active && state.open) {
    // fallback wobble from native scroll velocity
    fbVel *= Math.pow(0.86, dt * 60)
    const sc = $('#glass .scroller'), d = document.getElementById('fx-disp')
    const amp = state.motion === 'full' ? Math.min(16, Math.abs(fbVel) * 0.22) : 0
    sc.style.setProperty('--vel', (fbVel * 0.6).toFixed(2))
    if (amp > 0.5) { d.setAttribute('scale', amp.toFixed(1)); sc.querySelector('.sheet').style.filter = 'url(#fx-ripple)' }
    else sc.querySelector('.sheet').style.filter = ''

  fps.n++; if (t - fps.t > 1) { fps.v = fps.n / (t - fps.t); fps.n = 0; fps.t = t; window.__fps = fps.v }

}
function draw(t) {

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, R.bgTex); gl.uniform1i(q.uBg, 0)

/* =====================================================================

   ===================================================================== */

applyMotion()
setSound(false)

document.fonts?.ready.then(() => { layout(); if (state.open) panelLayout() })

// deep-link for screenshots/tests: ?open=1 opens the selected item
itemEls[state.cat][state.sel[state.cat]].focus({ preventScroll: true })

window.__wave = { state, P, HIC, RENDER, now, activate, closeSheet, scrollBy, ripple, setCat, setSel, layout }
</script>
